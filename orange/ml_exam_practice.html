<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Exam Practice — Dr. Chen's Stroke Risk Prediction</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.header{background:#c0392b;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header .title{font-size:14px;text-align:right;line-height:1.3}
.header .title span{display:block;font-weight:700}
.progress{display:flex;gap:4px;align-items:center;justify-content:center;flex:1}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.3);transition:background 0.3s;cursor:pointer}
.dot.done{background:#fff}
.dot.current{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.5)}
.prompt-bar{text-align:center;color:#fff;font-size:13px;background:#c0392b;padding:0 0 10px;font-weight:500}
.container{max-width:800px;margin:0 auto;padding:40px 24px 120px;min-height:80vh}
.question{display:none}
.question.active{display:block}
.q-text{font-size:18px;line-height:1.6;margin-bottom:24px}
.q-text strong{color:#c0392b}
.hint-box{background:#f0f4f8;border-left:4px solid #3498db;padding:10px 16px;margin:0 0 20px;font-size:13px;color:#555;line-height:1.5;border-radius:0 4px 4px 0}
.scenario-box{background:#fdf6e3;border-radius:8px;padding:24px;margin-bottom:24px;font-size:16px;line-height:1.6;text-align:center}
.options{display:flex;flex-direction:column;gap:10px;max-width:600px;margin:0 auto}
.option{background:#fff;border:1px solid #ddd;border-radius:6px;padding:16px 20px;cursor:pointer;font-size:15px;transition:all 0.2s;user-select:none}
.option:hover{border-color:#999;background:#fafafa}
.option.selected{background:#1a8a7d;color:#fff;border-color:#1a8a7d}
.option.wrong{background:#e74c3c;color:#fff;border-color:#e74c3c}
.option.faded{opacity:0.4;pointer-events:none}
.option.disabled{pointer-events:none}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px;margin:0 auto}
.btn-continue{position:fixed;bottom:24px;right:24px;background:#27ae60;color:#fff;border:none;padding:14px 28px;font-size:15px;font-weight:700;border-radius:6px;cursor:pointer;display:none;z-index:99;letter-spacing:0.5px}
.btn-continue:hover{background:#219a52}
.btn-continue.visible{display:block}
.toast{position:fixed;bottom:80px;right:24px;background:#1a8a7d;color:#fff;padding:14px 20px;border-radius:8px;font-size:14px;display:none;max-width:350px;z-index:100;line-height:1.4}
.toast.visible{display:block}
.toast .close-toast{position:absolute;top:4px;left:8px;cursor:pointer;font-size:16px;opacity:0.7}
/* Type 5: typing */
.typing-container{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;font-size:18px;line-height:2;justify-content:center;margin:20px 0}
.typing-container .word{white-space:nowrap}
.char-box{display:inline-block;width:22px;height:28px;border:1px solid #ccc;border-radius:3px;text-align:center;font-size:16px;font-weight:700;line-height:28px;margin:0 1px;outline:none;text-transform:lowercase}
.char-box.correct{background:#27ae60;color:#fff;border-color:#27ae60}
.char-box.incorrect{background:#f1c40f;color:#333;border-color:#f1c40f}
.char-box.given{background:#eee;color:#666;border-color:#ccc}
.btn-hint{position:fixed;bottom:24px;right:24px;background:#f39c12;color:#fff;border:none;padding:14px 28px;font-size:15px;font-weight:700;border-radius:6px;cursor:pointer;display:none;z-index:99}
/* Type 6: binary sort cards */
.carousel-wrap{display:flex;align-items:center;justify-content:center;gap:12px;margin:20px auto}
.carousel-arrow{font-size:28px;color:#999;cursor:pointer;user-select:none;padding:8px;min-width:32px;text-align:center}
.carousel-arrow:hover{color:#333}
.carousel-arrow.disabled{color:#ddd;cursor:default}
.card-stack{background:#fdf6e3;border-radius:8px;padding:24px;max-width:500px;flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.binary-buttons{display:flex;gap:12px;justify-content:center;margin-top:16px}
.binary-btn{background:#8e44ad;color:#fff;border:none;padding:12px 24px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600;min-width:140px}
.binary-btn:hover{opacity:0.9}
.binary-btn.correct-btn{background:#1a8a7d}
.binary-btn.wrong-btn{background:#e74c3c}
.binary-btn:disabled{opacity:0.4;cursor:default;pointer-events:none}
/* Type 9: matching */
.match-table{width:100%;max-width:600px;margin:0 auto;border-collapse:separate;border-spacing:0 6px}
.match-table td{padding:12px 16px;font-size:14px;border-radius:4px}
.match-table .match-left{background:#1a8a7d;color:#fff;width:30%;font-weight:600}
.match-table .match-right{background:#e0f2f1;cursor:pointer;transition:all 0.2s}
.match-table .match-right:hover{background:#b2dfdb}
.match-table .match-right.locked{background:#1a8a7d;color:#fff;pointer-events:none}
.match-table .match-left.highlight{box-shadow:0 0 0 3px #f39c12}
/* Type 4: fill blank table */
.fill-table{margin:20px auto;border-collapse:collapse;font-size:14px}
.fill-table th{background:#333;color:#fff;padding:8px 14px;font-weight:600}
.fill-table td{padding:8px 14px;border:1px solid #ddd;min-width:100px;text-align:center}
.fill-table .blank-cell{background:#f5f5f5;border:1px solid #ccc;cursor:default;color:#999}
.fill-table .blank-cell.active-blank{background:#f9e6e6;border:3px solid #c0392b;color:#c0392b;font-weight:700;animation:pulse-blank 1.5s infinite}
.fill-table .filled-cell{background:#1a8a7d;color:#fff;font-weight:600}
@keyframes pulse-blank{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.3)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)}}
/* Results */
.results-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center}
.results-overlay.visible{display:flex}
.results-card{background:#fff;border-radius:12px;padding:40px;text-align:center;max-width:400px;width:90%}
.results-card h2{font-size:22px;margin-bottom:4px}
.results-card h3{font-size:16px;color:#c0392b;margin-bottom:24px;font-weight:700}
.results-circles{display:flex;justify-content:center;gap:40px;margin:20px 0 24px}
.circle-stat{text-align:center}
.circle-stat .label{font-size:12px;color:#999;margin-top:6px}
.circle-ring{width:80px;height:80px;position:relative}
.circle-ring svg{transform:rotate(-90deg)}
.circle-ring .value{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:700}
.btn-finish{background:#27ae60;color:#fff;border:none;padding:14px 40px;font-size:15px;font-weight:700;border-radius:6px;cursor:pointer;width:100%}
</style>
</head>
<body>
<div class="header">
<span></span>
<div class="progress" id="progressBar"></div>
<div class="title"><span>ML EXAM PRACTICE</span>Dr. Chen's Stroke Model</div>
</div>
<div class="prompt-bar" id="promptBar"></div>
<div class="container" id="loginScreen" style="text-align:center;padding-top:80px">
<h2 style="margin-bottom:8px">ML Exam Practice</h2>
<p style="color:#666;margin-bottom:32px">Dr. Chen's Stroke Risk Prediction Model</p>
<input type="text" id="studentName" placeholder="Enter your full name" style="font-size:16px;padding:12px 20px;border:2px solid #ccc;border-radius:6px;width:300px;text-align:center;outline:none;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto">
<input type="text" id="studentId" placeholder="Enter your student ID" style="font-size:16px;padding:12px 20px;border:2px solid #ccc;border-radius:6px;width:300px;text-align:center;outline:none;margin-bottom:24px;display:block;margin-left:auto;margin-right:auto">
<button onclick="startExam()" style="background:#27ae60;color:#fff;border:none;padding:14px 40px;font-size:16px;font-weight:700;border-radius:6px;cursor:pointer">START</button>
</div>
<div class="container" id="questionContainer" style="display:none"></div>
<button class="btn-continue" id="btnContinue" onclick="nextQuestion()">CONTINUE</button>
<button class="btn-hint" id="btnHint" style="display:none">Give me a hint</button>
<div class="toast" id="toast"></div>
<div class="results-overlay" id="resultsOverlay">
<div class="results-card">
<h2>PRACTICE COMPLETE</h2>
<h3>DR. CHEN'S STROKE MODEL</h3>
<div class="results-circles">
<div class="circle-stat"><div class="circle-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="#eee" stroke-width="3"/><circle id="timeCircle" cx="18" cy="18" r="16" fill="none" stroke="#3498db" stroke-width="3" stroke-dasharray="100 100" stroke-linecap="round"/></svg><div class="value" id="timeValue">0:00</div></div><div class="label">TOTAL TIME</div></div>
<div class="circle-stat"><div class="circle-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" stroke="#eee" stroke-width="3"/><circle id="scoreCircle" cx="18" cy="18" r="16" fill="none" stroke="#f39c12" stroke-width="3" stroke-dasharray="0 100" stroke-linecap="round"/></svg><div class="value" id="scoreValue">0/0</div></div><div class="label">SCORE</div></div>
</div>
<p id="studentLabel" style="font-size:13px;color:#666;margin-bottom:4px"></p>
<button class="btn-finish" onclick="saveHTML()" style="margin-bottom:8px">Save &amp; Download HTML</button>
<button class="btn-finish" onclick="location.reload()" style="background:#999">Try Again</button>
</div>
<div id="answerLog" style="display:none"></div>
</div>

<script>
const questions = [
// Q1: Context
{type:'context',prompt:'',text:'<strong>Scenario:</strong> Dr. Chen is a neurologist who wants to build a machine learning model to predict stroke risk in patients visiting her outpatient clinic.<br><br>Her dataset contains <strong>500 patients</strong>, of whom <strong>80 had a stroke</strong> (the event). She initially considers <strong>20 candidate predictors</strong> including age, blood pressure, cholesterol, smoking status, diabetes, BMI, and other clinical variables.<br><br>Let\'s help Dr. Chen build, evaluate, and deploy her prediction model.'},
// Q2: Type EPV
{type:'typing',prompt:'Type an answer in each blank',text:'Before training any model, Dr. Chen needs to check if her sample size is sufficient. The key metric is <strong>Events Per Variable (EPV)</strong>.<br><br>EPV = minimum(positives, negatives) / number of candidate predictors<br><br>With 80 events and 20 candidate predictors, EPV = ',blanks:[{answer:'4',given:''}],points:1},
// Q3: MC EPV sufficiency
{type:'mc',prompt:'Select an answer',text:'Dr. Chen\'s EPV is 4. Is this sufficient for <strong>logistic regression</strong>, which typically requires EPV of 10–50?',options:['Yes — EPV of 4 is within the acceptable range for logistic regression','No — EPV of 4 is below the minimum of 10 needed for logistic regression','It depends on the number of patients, not EPV'],correct:1,explanation:'Logistic regression requires EPV of 10–50. EPV = 4 is far below the minimum, meaning the model will likely overfit.',points:1},
// Q4: Binary sort — Algorithm EPV
{type:'binary',prompt:'Select an answer for each card',text:'Different ML algorithms require different minimum EPV. Sort each algorithm into the correct EPV requirement:',hint:'Statistical ML algorithms generally need less data than computational ML algorithms.',cards:[{text:'Logistic Regression',answer:0},{text:'Decision Tree (CART)',answer:0},{text:'Random Forest',answer:1},{text:'SVM',answer:1},{text:'Neural Network',answer:1}],categories:['EPV 10–50 sufficient','EPV 100–200 needed'],points:5},
// Q5: MC — fix sample size
{type:'mc',prompt:'Select an answer',text:'Dr. Chen\'s EPV is too low. Which approach would <strong>most directly increase EPV</strong> without collecting more data?',hint:'EPV = events / candidate predictors',options:['Increase the number of cross-validation folds','Reduce the number of candidate predictors using feature selection or PCA','Use a more complex algorithm like neural network','Remove patients with missing values'],correct:1,explanation:'EPV = events / predictors. Reducing predictors (e.g., from 20 to 5) directly increases EPV. PCA or feature selection can achieve this.',points:1},
// Q6: Context bridge
{type:'context',prompt:'',text:'Dr. Chen uses Chi-squared feature selection to reduce from 20 to <strong>5 predictors</strong>: age, systolic blood pressure, smoking status, diabetes, and atrial fibrillation.<br><br>New EPV = 80 / 5 = <strong>16</strong> — sufficient for logistic regression!<br><br>She proceeds to build her model using Orange Data Mining software.'},
// Q7: Match order — ML workflow
{type:'match_order',prompt:'Match each step with its correct order',text:'Dr. Chen needs to follow the correct ML workflow in Orange. Can you put these steps in the right order?',labels:['Step 1','Step 2','Step 3','Step 4','Step 5','Step 6'],answers:['Split data (train/test)','Detect and remove outliers','Impute missing values','Select features','Train models','Cross-validate'],shuffled:['Cross-validate','Select features','Split data (train/test)','Train models','Impute missing values','Detect and remove outliers'],points:6},
// Q8: MC — data split
{type:'mc',prompt:'Select an answer',text:'Why must the test set be set aside <strong>first</strong>, before any preprocessing?',options:['To make preprocessing faster with less data','To prevent data leakage — preprocessing on the full dataset would leak test information into training','To ensure the test set has more outliers','To balance the class distribution'],correct:1,explanation:'If you preprocess (imputation, scaling, feature selection) on the full dataset, information from test samples leaks into the training process, making performance estimates optimistically biased.',points:1},
// Q9: Fill blank — Calibration
{type:'fill_blank_table',prompt:'Select an answer for each blank',text:'After training, Dr. Chen evaluates calibration. The calibration regression is: logit(Y) = a + b · logit(p̂). Fill in the interpretation:',table:{headers:['Parameter','Value','Interpretation'],rows:[['Intercept (a)','a > 0','_blank_'],['Intercept (a)','a < 0','_blank_'],['Slope (b)','b < 1','_blank_'],['Slope (b)','b > 1','_blank_']]},blanks:[{options:['Model underestimates risk','Model overestimates risk','Predictions are too spread','Predictions are too narrow'],correct:0},{options:['Model underestimates risk','Model overestimates risk','Predictions are too spread','Predictions are too narrow'],correct:1},{options:['Underestimates low-prob, overestimates high-prob','Overestimates low-prob, underestimates high-prob','Perfect calibration','No systematic bias'],correct:0},{options:['Underestimates low-prob, overestimates high-prob','Overestimates low-prob, underestimates high-prob','Perfect calibration','No systematic bias'],correct:1}],points:4},
// Q10: Fill blank sentence — Threshold
{type:'fill_blank_sentence',prompt:'Select an answer for each blank',text:'Dr. Chen needs to choose a threshold. The cost-aware threshold depends on the clinical context:',hint:'p<sub>t</sub> = (C<sub>FP</sub> − C<sub>TN</sub>) / (C<sub>FP</sub> − C<sub>TN</sub> + C<sub>FN</sub> − C<sub>TP</sub>)',sentences:['For a <strong>screening</strong> test where missing disease is very costly (high C_FN), the threshold should be _blank_, favoring <strong>sensitivity</strong>.','For a <strong>confirmatory</strong> test where false alarms are very costly (high C_FP), the threshold should be _blank_, favoring <strong>specificity</strong>.'],blanks:[[{text:'lower',correct:true},{text:'higher',correct:false}],[{text:'lower',correct:false},{text:'higher',correct:true}]],points:2},
// Q11: Type — threshold calculation
{type:'typing',prompt:'Type an answer in each blank',text:'Dr. Chen assigns costs for stroke screening:<br>C<sub>FP</sub> = 20 (unnecessary referral), C<sub>TN</sub> = 7 (screening cost), C<sub>FN</sub> = 95 (missed stroke), C<sub>TP</sub> = 45 (early intervention)<br><br>p<sub>t</sub> = (C<sub>FP</sub> − C<sub>TN</sub>) / (C<sub>FP</sub> − C<sub>TN</sub> + C<sub>FN</sub> − C<sub>TP</sub>) = (20−7) / (20−7+95−45) = 13/63 = ',blanks:[{answer:'0.21',given:'0.'}],points:1},
// Q12: Fill blank table — threshold effects
{type:'fill_blank_table',prompt:'Select an answer for each blank',text:'When Dr. Chen <strong>lowers</strong> the threshold (predicts more patients as positive), how does each cell of the confusion matrix change?',hint:'Lower threshold → more patients predicted positive. Think: if more are predicted positive, what happens to TP, FP, FN, TN?',table:{headers:['Cell','Effect of lowering threshold'],rows:[['True Positives (TP)','_blank_'],['False Positives (FP)','_blank_'],['False Negatives (FN)','_blank_'],['True Negatives (TN)','_blank_']]},blanks:[{options:['Increases','Decreases','Stays the same'],correct:0},{options:['Increases','Decreases','Stays the same'],correct:0},{options:['Increases','Decreases','Stays the same'],correct:1},{options:['Increases','Decreases','Stays the same'],correct:1}],points:4},
// Q13: Match carousel — Metrics
{type:'match_carousel',prompt:'Select an answer',text:'Match each metric to its correct formula:',hint:'Confusion matrix: Actual Positive → TP (predicted +) or FN (predicted −). Actual Negative → FP (predicted +) or TN (predicted −).',cards:[{text:'<strong>Sensitivity (Recall)</strong>',answer:'TP / (TP + FN)'},{text:'<strong>Specificity</strong>',answer:'TN / (TN + FP)'},{text:'<strong>PPV (Precision)</strong>',answer:'TP / (TP + FP)'},{text:'<strong>F1 Score</strong>',answer:'2TP / (2TP + FP + FN)'}],categories:['TP / (TP + FN)','TN / (TN + FP)','TP / (TP + FP)','2TP / (2TP + FP + FN)'],points:4},
// Q14: MC — accuracy trap
{type:'mc',prompt:'Select an answer',text:'Dr. Chen\'s dataset has 84% negative cases (no stroke). A naive model that <strong>always predicts "no stroke"</strong> achieves 84% accuracy. Why is this misleading?',options:['Because accuracy should always be above 90%','Because the model has 0% sensitivity — it misses every stroke patient','Because the model is overfitting to the training data','Because accuracy is never a valid metric'],correct:1,explanation:'A model predicting all negatives has 0% sensitivity (catches no strokes). Accuracy is misleading for imbalanced data because it rewards predicting the majority class.',points:1},
// Q15: MC — clinical utility
{type:'mc',prompt:'Select an answer',text:'In decision curve analysis, at which threshold probability does the "treat all" strategy have net benefit = 0?',hint:'Net benefit = TP/N − FP/N × p<sub>t</sub>/(1−p<sub>t</sub>). "Treat all" means everyone is predicted positive: TP = all positives, FP = all negatives.',options:['At threshold = 0.5 (the default)','At threshold = prevalence (the event rate)','At threshold = 1.0','At threshold = 0'],correct:1,explanation:'The "treat all" strategy has NB = prevalence at p_t = 0, and NB decreases linearly to 0 when p_t equals the prevalence. Beyond prevalence, treating everyone costs more than it benefits.',points:1},
// Q16: Binary sort — SHAP explainer
{type:'binary',prompt:'Select an answer for each card',text:'SHAP uses different explainer algorithms depending on the model type. Sort each algorithm into the correct SHAP explainer:',hint:'TreeExplainer computes exact Shapley values using the model\'s tree structure. KernelExplainer approximates using sampling.',cards:[{text:'Decision Tree',answer:0},{text:'Random Forest',answer:0},{text:'Gradient Boosting',answer:0},{text:'Naive Bayes',answer:1},{text:'SVM',answer:1},{text:'Neural Network',answer:1}],categories:['TreeExplainer (fast, exact)','KernelExplainer (slow, approximate)'],points:6},
// Q17: MC — fairness
{type:'mc',prompt:'Select an answer',text:'Dr. Chen\'s best model has AUC = 0.85 overall. However, when evaluated by sex, sensitivity is 0.82 for female patients (90% of the dataset) but only 0.40 for male patients (10%). Is this model fair?',options:['Yes — the overall AUC is above 0.80, which is good','No — there is a large performance gap between subgroups, indicating potential unfairness','Yes — fairness means equal predictions, not equal performance','It cannot be determined without more data'],correct:1,explanation:'Fairness means comparable performance across subgroups. A sensitivity of 0.40 for males vs. 0.82 for females is a large gap. This likely results from underrepresentation of males in the training data.',points:1},
// Q18: Multi-select — drift
{type:'multi',prompt:'Select multiple answers',text:'After deployment, Dr. Chen\'s model performance may degrade due to <strong>model drift</strong>. Which of the following are recognized types of model drift?',options:['Data drift','Concept drift','Label drift','Feature drift','Prediction drift'],correct:[0,1,2],explanation:'The three types are: data drift (feature distributions change), concept drift (feature-outcome relationship changes), and label drift (outcome distribution changes).',points:3},
// Q19: MC — recalibration
{type:'mc',prompt:'Select an answer',text:'Six months after deployment, Dr. Chen notices the model\'s calibration slope has drifted to 0.72 (was ~1.0). What should she do <strong>first</strong>?',options:['Retrain the model from scratch with new data','Recalibrate the model by updating the intercept and slope','Remove the model from clinical use immediately','Collect more training data and add new predictors'],correct:1,explanation:'Recalibration is preferred as a first step because it preserves the original model structure and requires less data than full retraining.',points:1},
// Q20: Conclude
{type:'context',prompt:'',text:'<strong>Well done!</strong><br><br>You\'ve helped Dr. Chen through the entire ML workflow: from checking sample size, to building and evaluating models, to understanding explainability, fairness, and deployment monitoring.'}
];

let current=0,score=0,totalPoints=0,startTime=Date.now(),answered=[];
let studentName='',studentId='';
const answerLog=[];
const cont=document.getElementById('btnContinue'),toast=document.getElementById('toast'),qc=document.getElementById('questionContainer');

// Calculate total points
questions.forEach(q=>{if(q.points)totalPoints+=q.points});

function startExam(){
studentName=document.getElementById('studentName').value.trim();
studentId=document.getElementById('studentId').value.trim();
if(!studentName||!studentId){alert('Please enter your name and student ID.');return}
document.getElementById('loginScreen').style.display='none';
qc.style.display='block';
startTime=Date.now();
buildProgress();renderQuestion();
}
function logAnswer(qIndex,response,correct,pts){
answerLog.push({q:qIndex+1,type:questions[qIndex].type,response:response,correct:correct,points:pts});
}

const DEV_MODE=false; // set to true for development (clickable progress dots)
function buildProgress(){
const pb=document.getElementById('progressBar');
pb.innerHTML='';
questions.forEach((_,i)=>{const d=document.createElement('div');d.className='dot';d.id='dot'+i;
if(DEV_MODE)d.onclick=function(){current=i;renderQuestion()};
pb.appendChild(d)});
}
function updateProgress(){
questions.forEach((_,i)=>{
const d=document.getElementById('dot'+i);
d.className='dot'+(i<current?' done':'')+(i===current?' current':'');
});
}
function showToast(msg){
toast.innerHTML=msg;toast.classList.add('visible');
}
function showContinue(){cont.classList.add('visible')}
function hideContinue(){cont.classList.remove('visible')}

function renderQuestion(){
hideContinue();toast.classList.remove('visible');
document.getElementById('btnHint').style.display='none';
updateProgress();
if(current>=questions.length){showResults();return}
const q=questions[current];
document.getElementById('promptBar').textContent=q.prompt||'';
let html='<div class="question active">';
switch(q.type){
case 'context':html+=renderContext(q);break;
case 'mc':html+=renderMC(q);break;
case 'typing':html+=renderTyping(q);break;
case 'binary':html+=renderBinary(q);break;
case 'match_order':html+=renderMatchOrder(q);break;
case 'fill_blank_table':html+=renderFillTable(q);break;
case 'fill_blank_sentence':html+=renderFillSentence(q);break;
case 'match_carousel':html+=renderMatchCarousel(q);break;
case 'multi':html+=renderMulti(q);break;
}
html+='</div>';
qc.innerHTML=html;
if(q.type==='context')showContinue();
if(q.type==='fill_blank_table')setTimeout(()=>highlightActiveBlank(q),0);
if(q.type==='typing'){setupTyping(q);
const hb=document.getElementById('btnHint');hb.style.display='block';
hb.onclick=function(){useHint(q)};
}
}

function renderHint(q){return q.hint?'<div class="hint-box">'+q.hint+'</div>':''}

// TYPE: Context
function renderContext(q){return '<div class="q-text">'+q.text+'</div>'}

// TYPE: MC (choose 1)
function renderMC(q){
let h='<div class="q-text">'+q.text+'</div>'+renderHint(q)+'<div class="options">';
q.options.forEach((o,i)=>{h+='<div class="option" onclick="checkMC('+i+')" id="opt'+i+'">'+o+'</div>'});
return h+'</div>';
}
function checkMC(i){
const q=questions[current];
if(q._answered)return;
if(i===q.correct){
q._answered=true;
const pts=q._wrong?0:q.points;
if(!q._wrong)score+=q.points;
logAnswer(current,q.options[i],true,pts);
document.querySelectorAll('.option').forEach((o,j)=>{
o.classList.add('disabled');
if(j===q.correct)o.classList.add('selected');
else o.classList.add('faded');
});
showToast(q.explanation);showContinue();
}else{
if(!q._wrong)q._wrong=true;
const el=document.getElementById('opt'+i);
el.classList.add('wrong');
setTimeout(()=>el.classList.remove('wrong'),600);
}
}

// TYPE: Multi-select
function renderMulti(q){
let h='<div class="q-text">'+q.text+'</div>'+renderHint(q)+'<p style="text-align:center;color:#888;font-size:13px;margin-bottom:12px">SELECT MULTIPLE ANSWERS</p><div class="options-grid">';
q._sel=new Set();
q.options.forEach((o,i)=>{h+='<div class="option" onclick="toggleMulti('+i+')" id="mopt'+i+'">'+o+'</div>'});
h+='</div>';return h;
}
function toggleMulti(i){
const q=questions[current];
if(q._done)return;
const el=document.getElementById('mopt'+i);
if(q._sel.has(i)){
// Allow deselecting
q._sel.delete(i);el.classList.remove('selected');
}else if(q.correct.includes(i)){
// Correct option — select it
q._sel.add(i);el.classList.add('selected');
// Check if all correct are selected
const sel=Array.from(q._sel).sort().join(',');
const cor=[...q.correct].sort().join(',');
if(sel===cor){
q._done=true;const mpts=q._wrong?0:q.points;if(!q._wrong)score+=q.points;
logAnswer(current,'Selected '+q.correct.length+' correct',!q._wrong,mpts);
document.querySelectorAll('.option').forEach((o,j)=>{o.classList.add('disabled');if(!q.correct.includes(j))o.classList.add('faded')});
showToast(q.explanation);showContinue();
}
}else{
// Wrong option — flash and penalize once
if(!q._wrong)q._wrong=true;
el.classList.add('wrong');
setTimeout(()=>el.classList.remove('wrong'),600);
}
}

// TYPE: Typing (single input field)
function renderTyping(q){
let h='<div class="q-text">'+q.text+'</div>'+renderHint(q)+'<div class="typing-container">';
q.blanks.forEach((b,bi)=>{
h+='<input type="text" class="typing-input" id="tinput'+bi+'" placeholder="Type answer..." autocomplete="off" style="font-size:18px;padding:8px 12px;border:2px solid #ccc;border-radius:6px;width:120px;text-align:center;outline:none">';
});
h+='</div>';return h;
}
function setupTyping(q){
const inputs=document.querySelectorAll('.typing-input');
if(inputs.length>0)inputs[0].focus();
inputs.forEach((inp,bi)=>{
inp.addEventListener('input',function(){
const ans=q.blanks[bi].answer;
const v=this.value;
if(!v){this.style.borderColor='#ccc';this.style.background='#fff';this.style.color='#333';return}
// Check if current input matches the answer so far
const partial=ans.substring(0,v.length);
if(v.toLowerCase()===partial.toLowerCase()){
this.style.borderColor='#27ae60';this.style.background='#e8f8e8';this.style.color='#27ae60';
if(v.toLowerCase()===ans.toLowerCase()){this.disabled=true;this.readOnly=true;checkTypingDone(q)}
}else{
this.style.borderColor='#f1c40f';this.style.background='#fef9e7';this.style.color='#b7950b';
}
});
});
}
function checkTypingDone(q){
const allDone=q.blanks.every((b,bi)=>{
const el=document.getElementById('tinput'+bi);
return el&&el.disabled;
});
if(allDone){score+=q.points;logAnswer(current,q.blanks.map(b=>b.answer).join(', '),true,q.points);showContinue();document.getElementById('btnHint').style.display='none'}
}
function useHint(q){
for(let bi=0;bi<q.blanks.length;bi++){
const el=document.getElementById('tinput'+bi);
if(el&&!el.disabled){
el.value=q.blanks[bi].answer;
el.style.borderColor='#27ae60';el.style.background='#e8f8e8';el.style.color='#27ae60';el.disabled=true;el.readOnly=true;
if(!q._hinted){q._hinted=true;q.points=Math.max(0,q.points-1)}
checkTypingDone(q);
return;
}
}
}

// TYPE: Binary sort
function renderBinary(q){
q._ci=0;q._score=0;q._view=0;
let h='<div class="q-text">'+q.text+'</div>'+renderHint(q);
h+='<div class="carousel-wrap"><span class="carousel-arrow disabled" id="binLeft" onclick="navBinary(-1)">&#8249;</span><div class="card-stack" id="binaryCard">'+q.cards[0].text+'</div><span class="carousel-arrow'+(q.cards.length>1?'':' disabled')+'" id="binRight" onclick="navBinary(1)">&#8250;</span></div>';
h+='<div class="binary-buttons">';
q.categories.forEach((c,i)=>{h+='<button class="binary-btn" onclick="checkBinary('+i+')">'+c+'</button>'});
h+='</div>';return h;
}
function navBinary(dir){
const q=questions[current];
if(q._ci>=q.cards.length)return;
q._view=Math.max(0,Math.min(q.cards.length-1,q._view+dir));
// Show the viewed card, but mark answered ones
const card=q.cards[q._view];
const cardEl=document.getElementById('binaryCard');
if(card._answered){cardEl.innerHTML='<span style="color:#1a8a7d">'+card.text+' → '+q.categories[card.answer]+'</span>'}
else{cardEl.innerHTML=card.text}
document.getElementById('binLeft').className='carousel-arrow'+(q._view<=0?' disabled':'');
document.getElementById('binRight').className='carousel-arrow'+(q._view>=q.cards.length-1?' disabled':'');
}
function checkBinary(choice){
const q=questions[current];
if(q._waiting||q._ci>=q.cards.length)return;
if(q.cards[q._view]._answered)return;
const card=q.cards[q._view];
const btns=document.querySelectorAll('.binary-btn');
if(choice===card.answer){
if(!card._wrong)score++;
card._answered=true;
btns[choice].classList.add('correct-btn');
q._waiting=true;
q._ci++;
setTimeout(()=>{
btns.forEach(b=>{b.classList.remove('correct-btn','wrong-btn')});
q._waiting=false;
// Find earliest unanswered
const nextUn=q.cards.findIndex(c=>!c._answered);
if(nextUn===-1){
q._ci=q.cards.length;
const wrongCount=q.cards.filter(c=>c._wrong).length;
logAnswer(current,'Sorted '+q.cards.length+' items',wrongCount===0,score);
document.getElementById('binaryCard').innerHTML='<strong>ALL DONE!</strong>';
document.querySelectorAll('.binary-btn').forEach(b=>b.disabled=true);
document.querySelectorAll('.carousel-arrow').forEach(a=>a.classList.add('disabled'));
showContinue();
}else{
q._ci=nextUn;q._view=nextUn;
document.getElementById('binaryCard').innerHTML=q.cards[q._view].text;
document.getElementById('binLeft').className='carousel-arrow'+(q._view<=0?' disabled':'');
document.getElementById('binRight').className='carousel-arrow'+(q._view>=q.cards.length-1?' disabled':'');
}
},800);
}else{
if(!card._wrong)card._wrong=true;
btns[choice].classList.add('wrong-btn');
setTimeout(()=>btns[choice].classList.remove('wrong-btn'),600);
}
}

// TYPE: Match order
function renderMatchOrder(q){
q._ci=0;q._display=[...q.shuffled];q._wrongs={};
let h='<div class="q-text">'+q.text+'</div>'+renderHint(q)+'<table class="match-table">';
q.labels.forEach((l,i)=>{
h+='<tr><td class="match-left" id="ml'+i+'">'+l+'</td><td class="match-right" id="mr'+i+'" onclick="checkMatchOrder('+i+')">'+q._display[i]+'</td></tr>';
});
h+='</table>';
setTimeout(()=>{if(document.getElementById('ml0'))document.getElementById('ml0').classList.add('highlight')},0);
return h;
}
function checkMatchOrder(clicked){
const q=questions[current];
if(q._ci>=q.labels.length)return;
const clickedEl=document.getElementById('mr'+clicked);
if(clickedEl.classList.contains('locked'))return;
const clickedText=clickedEl.textContent;
const expected=q.answers[q._ci];
if(clickedText===expected){
if(!q._wrongs[q._ci])score++;
// Swap: move clicked answer to the current step's row
const currentRowEl=document.getElementById('mr'+q._ci);
const currentRowText=currentRowEl.textContent;
if(clicked!==q._ci&&!currentRowEl.classList.contains('locked')){
currentRowEl.textContent=clickedText;
clickedEl.textContent=currentRowText;
}
// Lock the current row
currentRowEl.textContent=expected;
currentRowEl.classList.add('locked');
document.getElementById('ml'+q._ci).classList.remove('highlight');
q._ci++;
if(q._ci>=q.labels.length){const wrongM=Object.keys(q._wrongs).length;logAnswer(current,'Ordered '+q.labels.length+' steps',wrongM===0,q.labels.length-wrongM);showContinue()}
else{document.getElementById('ml'+q._ci).classList.add('highlight')}
}else{
if(!q._wrongs[q._ci])q._wrongs[q._ci]=true;
clickedEl.style.background='#e74c3c';clickedEl.style.color='#fff';
setTimeout(()=>{clickedEl.style.background='';clickedEl.style.color=''},600);
}
}

// TYPE: Fill blank table
function renderFillTable(q){
q._bi=0;
let h='<div class="q-text">'+q.text+'</div>'+renderHint(q)+'<table class="fill-table"><tr>';
q.table.headers.forEach(hd=>{h+='<th>'+hd+'</th>'});
h+='</tr>';
q.table.rows.forEach((r,ri)=>{
h+='<tr>';
r.forEach((c,ci)=>{
if(c==='_blank_'){
h+='<td class="blank-cell" id="ftcell'+ri+'"></td>';
}else{
h+='<td>'+c+'</td>';
}
});
h+='</tr>';
});
h+='</table><div class="options-grid" id="ftOptions" style="margin-top:20px">';
if(q.blanks.length>0){
q.blanks[0].options.forEach((o,i)=>{h+='<div class="option" onclick="checkFillTable('+i+')">'+o+'</div>'});
}
h+='</div>';return h;
}
function checkFillTable(i){
const q=questions[current];
const b=q.blanks[q._bi];
const opts=document.querySelectorAll('#ftOptions .option');
if(opts[i].classList.contains('disabled'))return;
if(i===b.correct){
if(!b._wrong)score++;
const ri=findBlankRow(q,q._bi);
const cell=document.getElementById('ftcell'+ri);
if(cell){
cell.textContent=b.options[b.correct];
cell.classList.remove('blank-cell','active-blank');
cell.classList.add('filled-cell');
}
opts[i].classList.add('selected','disabled');
q._bi++;
if(q._bi>=q.blanks.length){const wrongBlanks=q.blanks.filter(b=>b._wrong).length;logAnswer(current,'Filled '+q.blanks.length+' blanks',wrongBlanks===0,q.blanks.length-wrongBlanks);showContinue()}
else{renderFillTableOpts(q)}
}else{
if(!b._wrong)b._wrong=true;
opts[i].classList.add('wrong');
setTimeout(()=>{if(opts[i])opts[i].classList.remove('wrong')},600);
}
}
function renderFillTableOpts(q){
const container=document.getElementById('ftOptions');
container.innerHTML='';
q.blanks[q._bi].options.forEach((o,j)=>{
container.innerHTML+='<div class="option" onclick="checkFillTable('+j+')">'+o+'</div>';
});
highlightActiveBlank(q);
}
function highlightActiveBlank(q){
// Use ftcell IDs directly — querySelectorAll('.blank-cell') count changes as cells get filled
const totalBlanks=q.blanks.length;
for(let i=0;i<totalBlanks;i++){
const cell=document.getElementById('ftcell'+findBlankRow(q,i));
if(!cell||cell.classList.contains('filled-cell'))continue;
cell.classList.toggle('active-blank',i===q._bi);
if(i===q._bi)cell.textContent='?';
else cell.textContent='';
}
}
function findBlankRow(q,blankIndex){
// Map blank index to the table row index that has '_blank_'
let bi=0;
for(let ri=0;ri<q.table.rows.length;ri++){
if(q.table.rows[ri].includes('_blank_')){
if(bi===blankIndex)return ri;
bi++;
}
}
return 0;
}

// TYPE: Fill blank sentence
function renderFillSentence(q){
q._bi=0;
let h='<div class="q-text">'+q.text+'</div>'+renderHint(q);
q.sentences.forEach((s,si)=>{
const blankStyle=si===0?'border-bottom:3px solid #c0392b;padding:0 8px;animation:pulse-blank 1.5s infinite':'border-bottom:2px solid #ccc;padding:0 8px';
const blankText='\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0\u00a0';
h+='<p class="q-text" id="fbs'+si+'" style="margin:12px 0">'+s.replace('_blank_','<strong style="'+blankStyle+'" id="fbblank'+si+'">'+blankText+'</strong>')+'</p>';
});
h+='<div class="options-grid" id="fbOptions" style="margin-top:20px">';
q.blanks[0].forEach((o,i)=>{
h+='<div class="option" onclick="checkFillSentence('+i+')">'+o.text+'</div>';
});
h+='</div>';return h;
}
function checkFillSentence(i){
const q=questions[current];
const opts=q.blanks[q._bi];
if(opts[i].correct){
if(!q._wrongs||!q._wrongs[q._bi])score++;
const blank=document.getElementById('fbblank'+q._bi);
blank.textContent=opts[i].text;
blank.style.color='#1a8a7d';blank.style.borderBottom='3px solid #1a8a7d';blank.style.animation='none';blank.style.fontWeight='700';
q._bi++;
if(q._bi>=q.blanks.length){const wrongS=q._wrongs?Object.keys(q._wrongs).length:0;logAnswer(current,'Filled '+q.blanks.length+' blanks',wrongS===0,q.blanks.length-wrongS);showContinue()}
else{
const nextBlank=document.getElementById('fbblank'+q._bi);
nextBlank.style.borderBottom='3px solid #c0392b';nextBlank.style.color='#c0392b';nextBlank.style.animation='pulse-blank 1.5s infinite';
const container=document.getElementById('fbOptions');
container.innerHTML='';
q.blanks[q._bi].forEach((o,j)=>{
container.innerHTML+='<div class="option" onclick="checkFillSentence('+j+')">'+o.text+'</div>';
});
}
}else{
if(!q._wrongs)q._wrongs={};
if(!q._wrongs[q._bi])q._wrongs[q._bi]=true;
const btns=document.querySelectorAll('#fbOptions .option');
if(btns[i])btns[i].classList.add('wrong');
setTimeout(()=>{if(btns[i])btns[i].classList.remove('wrong')},600);
}
}

// TYPE: Match carousel
function renderMatchCarousel(q){
q._ci=0;q._view=0;
let h='<div class="q-text">'+q.text+'</div>'+renderHint(q);
h+='<div class="carousel-wrap"><span class="carousel-arrow disabled" id="carLeft" onclick="navCarousel(-1)">&#8249;</span><div class="card-stack" id="carouselCard">'+q.cards[0].text+'</div><span class="carousel-arrow'+(q.cards.length>1?'':' disabled')+'" id="carRight" onclick="navCarousel(1)">&#8250;</span></div>';
h+='<div class="options-grid" id="carouselOpts">';
q.categories.forEach((c,i)=>{h+='<div class="option" onclick="checkCarousel('+i+')">'+c+'</div>'});
h+='</div>';return h;
}
function navCarousel(dir){
const q=questions[current];
if(q._ci>=q.cards.length)return;
q._view=Math.max(0,Math.min(q.cards.length-1,q._view+dir));
const card=q.cards[q._view];
const cardEl=document.getElementById('carouselCard');
if(card._answered){cardEl.innerHTML='<span style="color:#1a8a7d">'+card.text+' → '+card.answer+'</span>'}
else{cardEl.innerHTML=card.text}
document.getElementById('carLeft').className='carousel-arrow'+(q._view<=0?' disabled':'');
document.getElementById('carRight').className='carousel-arrow'+(q._view>=q.cards.length-1?' disabled':'');
}
function checkCarousel(i){
const q=questions[current];
if(q._waiting||q._ci>=q.cards.length)return;
if(q.cards[q._view]._answered)return;
const card=q.cards[q._view];
const correct=q.categories.indexOf(card.answer);
const opts=document.querySelectorAll('#carouselOpts .option');
if(i===correct){
if(!card._wrong)score++;
card._answered=true;
opts[i].classList.add('selected');
q._waiting=true;
q._ci++;
setTimeout(()=>{
opts.forEach(o=>{o.classList.remove('selected','wrong')});
q._waiting=false;
const nxt=q.cards.findIndex(c=>!c._answered);
if(nxt===-1){
q._ci=q.cards.length;
const wrongCount2=q.cards.filter(c=>c._wrong).length;
logAnswer(current,'Matched '+q.cards.length+' items',wrongCount2===0,q.cards.length-wrongCount2);
document.getElementById('carouselCard').innerHTML='<strong>ALL DONE!</strong>';
opts.forEach(o=>{o.style.pointerEvents='none';o.style.opacity='0.4'});
document.querySelectorAll('.carousel-arrow').forEach(a=>a.classList.add('disabled'));
showContinue();
}else{
q._ci=nxt;q._view=nxt;
document.getElementById('carouselCard').innerHTML=q.cards[q._view].text;
document.getElementById('carLeft').className='carousel-arrow'+(q._view<=0?' disabled':'');
document.getElementById('carRight').className='carousel-arrow'+(q._view>=q.cards.length-1?' disabled':'');
}
},800);
}else{
if(!card._wrong)card._wrong=true;
opts[i].classList.add('wrong');
setTimeout(()=>opts[i].classList.remove('wrong'),600);
}
}

function nextQuestion(){
current++;renderQuestion();
}

function showResults(){
const elapsed=Math.floor((Date.now()-startTime)/1000);
const mins=Math.floor(elapsed/60);
const secs=elapsed%60;
const timeStr=mins+':'+(secs<10?'0':'')+secs;
document.getElementById('timeValue').textContent=timeStr;
document.getElementById('scoreValue').textContent=score+' / '+totalPoints;
const pct=Math.round(score/totalPoints*100);
document.getElementById('scoreCircle').setAttribute('stroke-dasharray',pct+' 100');
document.getElementById('timeCircle').setAttribute('stroke-dasharray','100 100');
document.getElementById('studentLabel').textContent=studentName+' ('+studentId+')';
document.getElementById('resultsOverlay').classList.add('visible');
hideContinue();
document.getElementById('promptBar').textContent='PRACTICE COMPLETE';
// Store metadata for save
window._examMeta={name:studentName,id:studentId,score:score,total:totalPoints,pct:pct,time:timeStr,date:new Date().toLocaleString(),log:answerLog};
}
