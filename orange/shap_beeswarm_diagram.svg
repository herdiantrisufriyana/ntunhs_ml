<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 530" font-family="Arial, sans-serif">
  <rect width="540" height="530" fill="white"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">SHAP Beeswarm Plot (Global Explanation)</text>

  <defs>
    <!-- Vertical gradient: top=red (high), bottom=blue (low) -->
    <linearGradient id="featureGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="50%" stop-color="#CCC"/>
      <stop offset="100%" stop-color="#3B5998"/>
    </linearGradient>
  </defs>

  <g transform="translate(130, 50)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="250" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="250" x2="320" y2="250" stroke="#333" stroke-width="1.5"/>

    <!-- Center line (SHAP = 0) -->
    <line x1="160" y1="0" x2="160" y2="250" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- X-axis label and note -->
    <text x="160" y="275" text-anchor="middle" font-size="12" fill="#333">SHAP value (impact on predicted probability)</text>
    <text x="160" y="290" text-anchor="middle" font-size="9" fill="#888">E[f(x)] = 0.30  |  For each sample: sum of all SHAP values = f(x) - E[f(x)]</text>

    <!-- X-axis ticks: range -0.2 to +0.2, scale = 160px / 0.2 = 800 px per unit -->
    <text x="0" y="265" text-anchor="middle" font-size="9" fill="#555">-0.20</text>
    <text x="80" y="265" text-anchor="middle" font-size="9" fill="#555">-0.10</text>
    <text x="160" y="265" text-anchor="middle" font-size="9" fill="#555">0</text>
    <text x="240" y="265" text-anchor="middle" font-size="9" fill="#555">+0.10</text>
    <text x="320" y="265" text-anchor="middle" font-size="9" fill="#555">+0.20</text>

    <!-- Feature 1: age (most important, wide spread, ~-0.15 to +0.18) -->
    <text x="-8" y="30" text-anchor="end" font-size="11" fill="#333">age</text>
    <circle cx="40" cy="25" r="3.5" fill="#4A6FA5" opacity="0.7"/>
    <circle cx="60" cy="28" r="3.5" fill="#5B7DB5" opacity="0.7"/>
    <circle cx="80" cy="22" r="3.5" fill="#6A8BC0" opacity="0.7"/>
    <circle cx="105" cy="26" r="3.5" fill="#8BAAD0" opacity="0.7"/>
    <circle cx="130" cy="23" r="3.5" fill="#AAC0DD" opacity="0.7"/>
    <circle cx="152" cy="27" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="170" cy="24" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="195" cy="28" r="3.5" fill="#D4A0A0" opacity="0.7"/>
    <circle cx="220" cy="22" r="3.5" fill="#D08080" opacity="0.7"/>
    <circle cx="248" cy="26" r="3.5" fill="#C86060" opacity="0.7"/>
    <circle cx="272" cy="24" r="3.5" fill="#C04040" opacity="0.7"/>
    <circle cx="304" cy="27" r="3.5" fill="#B83030" opacity="0.7"/>

    <!-- Feature 2: sbp (important, ~-0.12 to +0.14) -->
    <text x="-8" y="75" text-anchor="end" font-size="11" fill="#333">sbp</text>
    <circle cx="64" cy="70" r="3.5" fill="#4A6FA5" opacity="0.7"/>
    <circle cx="88" cy="73" r="3.5" fill="#5B7DB5" opacity="0.7"/>
    <circle cx="108" cy="68" r="3.5" fill="#7B9BC8" opacity="0.7"/>
    <circle cx="128" cy="72" r="3.5" fill="#AAC0DD" opacity="0.7"/>
    <circle cx="150" cy="75" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="168" cy="69" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="196" cy="73" r="3.5" fill="#D4A0A0" opacity="0.7"/>
    <circle cx="224" cy="70" r="3.5" fill="#C86060" opacity="0.7"/>
    <circle cx="252" cy="74" r="3.5" fill="#C04040" opacity="0.7"/>
    <circle cx="272" cy="71" r="3.5" fill="#B83030" opacity="0.7"/>

    <!-- Feature 3: bmi (moderate, ~-0.08 to +0.10) -->
    <text x="-8" y="120" text-anchor="end" font-size="11" fill="#333">bmi</text>
    <circle cx="96" cy="115" r="3.5" fill="#5B7DB5" opacity="0.7"/>
    <circle cx="112" cy="118" r="3.5" fill="#4A6FA5" opacity="0.7"/>
    <circle cx="128" cy="122" r="3.5" fill="#AAC0DD" opacity="0.7"/>
    <circle cx="144" cy="116" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="160" cy="120" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="176" cy="117" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="196" cy="121" r="3.5" fill="#D4A0A0" opacity="0.7"/>
    <circle cx="216" cy="118" r="3.5" fill="#C86060" opacity="0.7"/>
    <circle cx="240" cy="115" r="3.5" fill="#C04040" opacity="0.7"/>

    <!-- Feature 4: glucose (less important, ~-0.05 to +0.06) -->
    <text x="-8" y="165" text-anchor="end" font-size="11" fill="#333">glucose</text>
    <circle cx="120" cy="160" r="3.5" fill="#5B7DB5" opacity="0.7"/>
    <circle cx="132" cy="163" r="3.5" fill="#7B9BC8" opacity="0.7"/>
    <circle cx="142" cy="167" r="3.5" fill="#AAC0DD" opacity="0.7"/>
    <circle cx="153" cy="161" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="163" cy="165" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="175" cy="162" r="3.5" fill="#D4A0A0" opacity="0.7"/>
    <circle cx="188" cy="166" r="3.5" fill="#D08080" opacity="0.7"/>
    <circle cx="208" cy="163" r="3.5" fill="#C86060" opacity="0.7"/>

    <!-- Feature 5: sex (least important, ~-0.02 to +0.02) -->
    <text x="-8" y="210" text-anchor="end" font-size="11" fill="#333">sex</text>
    <circle cx="144" cy="205" r="3.5" fill="#4A6FA5" opacity="0.7"/>
    <circle cx="149" cy="208" r="3.5" fill="#4A6FA5" opacity="0.7"/>
    <circle cx="154" cy="212" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="160" cy="207" r="3.5" fill="#CCC" opacity="0.7"/>
    <circle cx="166" cy="211" r="3.5" fill="#C04040" opacity="0.7"/>
    <circle cx="171" cy="208" r="3.5" fill="#C04040" opacity="0.7"/>
    <circle cx="176" cy="205" r="3.5" fill="#B83030" opacity="0.7"/>

    <!-- Vertical color bar (right side) -->
    <rect x="340" y="50" width="12" height="150" fill="url(#featureGrad)" stroke="#999" stroke-width="0.5"/>
    <text x="356" y="62" font-size="9" fill="#C0392B">High</text>
    <text x="356" y="130" font-size="9" fill="#888">Feature</text>
    <text x="356" y="142" font-size="9" fill="#888">value</text>
    <text x="356" y="206" font-size="9" fill="#3B5998">Low</text>

    <!-- Interpretation annotations -->
    <path d="M 55,40 L 55,48" fill="none" stroke="#3B5998" stroke-width="1.2" marker-end="url(#arrowBlue)"/>
    <text x="20" y="58" font-size="8.5" fill="#3B5998">Low age</text>
    <text x="13" y="68" font-size="8.5" fill="#3B5998">= lower risk</text>

    <path d="M 295,40 L 295,48" fill="none" stroke="#C0392B" stroke-width="1.2" marker-end="url(#arrowRed)"/>
    <text x="278" y="58" font-size="8.5" fill="#C0392B">High age</text>
    <text x="272" y="68" font-size="8.5" fill="#C0392B">= higher risk</text>

    <!-- How-to box -->
    <rect x="0" y="305" width="320" height="82" rx="4" fill="#F5F5F0" stroke="#CCC" stroke-width="0.8"/>
    <text x="10" y="321" font-size="10" font-weight="bold" fill="#333">How to create:</text>
    <text x="10" y="335" font-size="9.5" fill="#444">1. Compute SHAP values for all samples (training set)</text>
    <text x="10" y="348" font-size="9.5" fill="#444">2. Each dot = one sample for one feature</text>
    <text x="10" y="361" font-size="9.5" fill="#444">3. x = SHAP value, color = feature value (low/high)</text>
    <text x="10" y="374" font-size="9.5" fill="#444">4. Features ranked by mean |SHAP| (top = most important)</text>

    <!-- Interpretation box -->
    <rect x="0" y="395" width="320" height="80" rx="4" fill="#EBF0FA" stroke="#4472C4" stroke-width="0.8"/>
    <text x="10" y="411" font-size="10" font-weight="bold" fill="#4472C4">Interpretation:</text>
    <text x="10" y="425" font-size="9.5" fill="#444">Wide spread = feature has large, variable impact</text>
    <text x="10" y="438" font-size="9.5" fill="#444">Clustered at 0 = feature has little impact (unimportant)</text>
    <text x="10" y="451" font-size="9.5" fill="#444">Red right + blue left = positive relationship with outcome</text>
    <text x="10" y="464" font-size="9.5" fill="#444">All SHAP values for 1 sample sum to f(x) - E[f(x)]</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#3B5998"/>
    </marker>
    <marker id="arrowRed" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#C0392B"/>
    </marker>
  </defs>
</svg>
